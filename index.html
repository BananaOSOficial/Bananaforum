<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width:device-width, initial-scale=1.0">
    <title>Banana Forum</title>
    <style>
      * {
        margin: 0;
		padding: 0;
      }
		svg {
			width: 32px;
			height: 32px;
		}
      body {
        background-color: rgb(15,15,15);
        color: #FFFFFF;
		background-image: url('darkbackground.jpg');
	    box-sizing: border-box;
      }
		h2 {
			text-align: center;
		}
      h1 {
        text-align: center;
        background: rgb(15,15,15);
      }
      #menucominicioecriarcomunidade {
        left: 0;
        background-color: transparent;
        width: 80px;
        height: 100vh;
		position: fixed;
      }
      #menucominicioecriarcomunidade button {
        display: flex;
        flex-direction: column;
        background-color: #303134;
        border: none;
        border-radius: 999px;
        color: #FFFFFF;
		align-items: center;
		width: 64px;
		height: 64px;
        padding: 15px 5px;
      }
      #menucominicioecriarcomunidade button svg:hover {
			fill: #5b8def;
	  }
		#janelacriarcomunidade {
			display: none;
			width: 100vw;
			height: 100vh;
			background: rgb(15,15,15);
			border: 2px solid rgba(255,255,255,0.08);
			z-index: 100;
			position: fixed;
		}
		#janelacriarcomunidade button {
			background-color: #303134;
			border-radius: 999px;
			width: 32px;
			height: 32px;
			border: none;
		}
		#iniciobtn.selecionado {
			background-color: #F5F5F5;
		}	
    </style>
  </head>
  <body>
    <header>
    <h1><u>Banana Forum</u></h1>
    </header>
    <div id="menucominicioecriarcomunidade">
      <button id="iniciobtn" title="Ínicio"><svg fill="#FFFFFF" version="1.1" id="Capa_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" 
	 width="800px" height="800px" viewBox="0 0 441.556 441.555"
	 xml:space="preserve">
<g>
	<path d="M405.584,262.377h-26.899v124.201c0,22-17.7,39.799-39.801,39.799h-236.3c-22,0-39.8-17.699-39.8-39.799V262.377h-26.9
		c-30,0-50.2-36.699-23.3-64.299l159.2-162.1c13.5-14.1,31.2-20.8,49-20.8s35.5,6.7,49.6,20.8l36.101,36.7v-32.4
		c0-14.1,11.6-25.1,25.7-25.1h21.399c13.5,0,25.101,11,25.101,25.1v106.5l50.199,51.4
		C455.685,225.678,436.185,262.377,405.584,262.377z"/>
</g>
	  </svg></button>
      <button id="criarcomunidadebtn" title="criar comunidade"><svg fill="#FFFFFF" version="1.1" id="Capa_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" 
	 width="800px" height="800px" viewBox="0 0 349.03 349.031"
	 xml:space="preserve">
<g>
	<path d="M349.03,141.226v66.579c0,5.012-4.061,9.079-9.079,9.079H216.884v123.067c0,5.019-4.067,9.079-9.079,9.079h-66.579
		c-5.009,0-9.079-4.061-9.079-9.079V216.884H9.079c-5.016,0-9.079-4.067-9.079-9.079v-66.579c0-5.013,4.063-9.079,9.079-9.079
		h123.068V9.079c0-5.018,4.069-9.079,9.079-9.079h66.579c5.012,0,9.079,4.061,9.079,9.079v123.068h123.067
		C344.97,132.147,349.03,136.213,349.03,141.226z"/>
</g>
      </svg></button>
    </div>
    <main>
      <h2>Comunidades</h2>
    </main>
	  <div id="janelacriarcomunidade">
		  <button class="fecharjanelacomunidade">X</button>
		  <h2>Criar comunidade</h2>
		  <p>Nome da comunidade</p>
		  <input placeholder="Nome">
	  </div>
	  <script>
		  const criarcomunidadebtn = document.getElementById('criarcomunidadebtn');
		  const fecharjanelacomunidadebtn = document.querySelector('.fecharjanelacomunidade');
		  const janelacriarcomunidade = document.getElementById('janelacriarcomunidade');
		  const iniciobtn = document.getElementById('iniciobtn');
		  iniciobtn.classList.add('selecionado');
		  criarcomunidadebtn.onclick = function() {
			  iniciobtn.classList.remove('selecionado');
			  janelacriarcomunidade.style.display = 'block';
		  }
		  fecharjanelacomunidadebtn.onclick = function() {
			  iniciobtn.classList.add('selecionado');
			  janelacriarcomunidade.style.display = 'none';
		  }
	  </script>
  </body>
</html>
