<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banana Forum</title>
    <style>
      * {
        margin: 0;
      }
		header {
			background-color: #000000;
			border-bottom: 2px solid rgba(255,255,255,0.1);
		}
		svg {
			width: 32px;
			height: 32px;
			filter: drop-shadow(2px 2px 5px rgba(15,15,15,0.5));
		}
      body {
        background-color: #0F0F0F;
        color: #FFFFFF;
		font-family: inter;
      }
		h2 {
			text-align: center;
		}
      h1 {
		color: #F7D117;
        text-align: center;
      }
		p {
			font-weight: bold;
		}
      #menucominicioecriarcomunidade {
        left: 0;
        background-color: transparent;
        width: 70px;
        height: 100vh;
		position: fixed;
      }
      #menucominicioecriarcomunidade button {
        display: flex;
        flex-direction: column;
        background-color: #303134;
        border: none;
        border-radius: 999px;
        color: #FFFFFF;
		align-items: center;
		width: 64px;
		height: 64px;
	    padding: 15px 5px;
      }
		#janelacriarcomunidade {
			display: none;
			top: 0;
			width: 100vw;
			height: 100vh;
			background: #0F0F0F;
			z-index: 100;
			position: fixed;
		}
		.fecharjanelacomunidade {
			background-color: #303134;
			border-radius: 999px;
			width: 32px;
			height: 32px;
			border: 1px solid rgba(255,255,255,0.05);
			color: #FFFFFF;
		}
		.fecharjanelacomunidade:hover {
			background-color: #F7D117;
			border-color: yellow;
		}
		#iniciobtn.selecionado {
			background-color: #F7D117;
			box-shadow: 0 0 10px #F7D117;
		}
		#iniciobtn {
			margin-top: 200px;
		}
		input {
			background-color: #303134;
			border-radius: 999px;
			border: none;
			color: #FFFFFF;
		}
		input:focus {
			outline: 1px solid #F7D117;
		}
		#modelo-comunidade {
			display: none;
			background-color: transparent;
			border-radius: 10px;
		}
		#modelo-comunidade h2:hover {
			color: #5b8def;
		}
		#container-comunidade {
			display: flex;
			flex-direction: column;
			gap: 10px;
		}
		#criar {
			background-color: #303134;
			border: 2px solid rgba(255,255,255,0.08);
			border-radius: 999px;
			color: #FFFFFF;
			}
		#criar:hover {
			background-color: #F7D117;
			border-color: yellow;
		}
		#comunidades {
			display: flex;
			flex-direction: column;
			align-items: center;
			position: relative;
	        padding-bottom: 10px;
		}
		#comunidades::after {
			content: "";
			width: 25%;
			background-color: #F7D117;
			height: 2px;
			position: absolute;
			bottom: 0;
			left: 50%;
			transform: translateX(-50%);
		}
		#janeladascomunidades {
			display: none;
			position: fixed;
			width: 100vw;
			height: 100vh;
			background-color: #0F0F0F;
			top: 0;
			padding: 20px 20px 0 20px;
		}
		#janeladascomunidades textarea {
	       display: flex;
		   position: static;
		   bottom: 20px;
		   background-color: #303134;
		   color: #FFFFFF;
		   border-radius: 20px;
		   resize: none;
			border: none;
		   flex: 1;
		}
		#janeladascomunidades textarea:focus {
			outline: 2px solid #F7D117;
		}
		#janeladascomunidades button {
			background-color: #303134;
			color: #FFFFFF;
				border-radius: 999px;
				border: 2px solid rgba(255,255,255,0.05);
		}
		#janeladascomunidades button:hover {
			background-color: #F7D117;
			border-color: yellow;
		}
		.container-conversa {
			display: flex;
			flex-direction: column;
			padding: 20px;
		}
		.caixa-conversa {
			display: none;
			color: #FFFFFF;
			background-color: transparent;
			border-radius: 20px;
			border: 2px solid rgba(255,255,255,0.05);
			word-wrap: break-word;
		    overflow-wrap: break-word;
			word-break: break-word;
			max-height: 500px;
			gap: 5px;
		}
		#chatebtn {
			flex-direction: row;
			align-items: center;
			display: flex;
			position: fixed;
			left: 50%;
			transform: translateX(-50%);
			bottom: 40px;
			gap: 15px;
		}
		.fecharjaneladascomunidades {
			width: 32px;
			height: 32px;
		}
		#janelacriarconta {
			display: none;
			width: 100vw;
			height: 100vh;
			background-color: #0F0F0F;
			position: fixed;
			top: 0;
		  }
		#janelacriarconta button {
			background-color: #303134;
			border: 2px solid rgba(255,255,255,0.08);
			border-radius: 999px;
			color: #FFFFFF;
		}
		#janelacriarconta button:hover {
			background-color: #F7D117;
			border-color: yellow;
		}
		.fecharjanelacriarconta {
			width: 32px;
			border-radius: 999px;
			height: 32px;
			background-color: #303134;
			border: 2px solid rgba(255,255,255,0.08);
		}
		.fecharjanelacriarconta:hover {
			background-color: #F7D117;
			border-color: yellow;
		}
		#olaenomeusuario {
			display: flex;
			margin-right: 0;
		}
		.nomeusuario:hover {
			color: #F7D117;
		}
		#inputnomeecriarcontabtn {
			display: flex;
			position: fixed;
			left: 50%;
			transform: translateX(-50%);
		}
    </style>
  </head>
  <body>
    <header>
    <h1><u>Banana Forum</u></h1>
	<div id="olaenomeusuario">
	<p>Olá,</p>
	<p class="nomeusuario">Usuario</p>
	</div>
    </header>
    <div id="menucominicioecriarcomunidade">

    </div>
    <main>
		<div id="comunidades">
	  <svg width="800px" height="800px" viewBox="0 0 28 28" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <g id="🔍-Product-Icons" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">

      <h2>Comunidades</h2>
		</div>
	  <div id="modelo-comunidade">
		  <h2 class="nome">Nome da comunidade</h2>
	  </div>
		<div id="container-comunidade"></div>
    </main>
	  <div id="janeladascomunidades">
		  <button class="fecharjaneladascomunidades">X</button>
		  <div class="caixa-conversa">
			  <p class="texto-conversa"></p>
		  </div>
		  <div class="container-conversa"></div>
		  <div id="chatebtn">
		  <textarea id="chat" placeholder="Converse com outros dessa comunidade"></textarea>
		  <button id="enviar">Enviar</button>
		  </div>
	  </div>
	  <div id="janelacriarcomunidade">
		  <button class="fecharjanelacomunidade">X</button>
		  <h2>Criar comunidade</h2>
		  <p>Nome da comunidade</p>
		  <input id="inputNomedacomunidade" placeholder="Nome">
		  <button id="criar">Criar comunidade</button>
	  </div>
	  <div id="janelacriarconta">
	  <button class="fecharjanelacriarconta">X</button>
      <h2>Crie sua conta</h2>
	  <div id="inputnomeecriarcontabtn">
	  <input class="inputnomedousuario" placeholder="Digite seu nome aqui">
	  <button class="criarcontabtn">Criar</button>
	  </div>
	  </div>
	  <script>
		  const criarcomunidadebtn = document.getElementById('criarcomunidadebtn');
		  const fecharjanelacomunidadebtn = document.querySelector('.fecharjanelacomunidade');
		  const janelacriarcomunidade = document.getElementById('janelacriarcomunidade');
		  const iniciobtn = document.getElementById('iniciobtn');
		  iniciobtn.classList.add('selecionado');
		  criarcomunidadebtn.onclick = function() {
			  iniciobtn.classList.remove('selecionado');
			  janelacriarcomunidade.style.display = 'block';
		  }
		  fecharjanelacomunidadebtn.onclick = function() {
			  iniciobtn.classList.add('selecionado');
			  janelacriarcomunidade.style.display = 'none';
		  }
		  const inputNomedacomunidade = document.getElementById('inputNomedacomunidade');
		  const container = document.getElementById('container-comunidade');
		  const botaocriarcomunidade = document.getElementById('criar');
		  const modelo = document.getElementById('modelo-comunidade');
          const janeladascomunidades = document.getElementById('janeladascomunidades');
		  botaocriarcomunidade.addEventListener('click', () => {
			  const novomodelo = modelo.cloneNode(true);
			  novomodelo.removeAttribute('id');
			  novomodelo.style.display = 'block';
			  const novoNome = inputNomedacomunidade.value;
			  const nomedacomunidade = novomodelo.querySelector('.nome');
			  nomedacomunidade.textContent = novoNome;
			  localStorage.setItem("comunidade", novoNome);
			  nomedacomunidade.onclick = () => {
		      janeladascomunidades.style.display = 'flex';
		  };
			  container.appendChild(novomodelo);
			  inputNomedacomunidade.value = ''
			  janelacriarcomunidade.style.display = 'none';
			  iniciobtn.classList.add('selecionado');
		  })
		  const chat = document.getElementById('chat');
		  const caixaconversa = document.querySelector('.caixa-conversa');
		  const textoconversa = document.querySelector('.texto-conversa');
		  const containerconversa = document.querySelector('.container-conversa');
		  const enviarbtn = document.getElementById('enviar');
		  enviarbtn.addEventListener('click', () => {
		  if (chat.value.trim() === "") {
		  alert('Escreva algo primeiro');
		  return;
		  }
		  const novacaixaconversa = caixaconversa.cloneNode(true);
		  novacaixaconversa.style.display = 'flex';
		  containerconversa.appendChild(novacaixaconversa);
		  const textodoinput = chat.value;
		  const textodaconversa = novacaixaconversa.querySelector('.texto-conversa');
		  textodaconversa.textContent = textodoinput;
		  chat.value = "";
		  })
		  const fecharjaneladascomunidades = document.querySelector('.fecharjaneladascomunidades');
		  fecharjaneladascomunidades.onclick = function() {
		  janeladascomunidades.style.display = 'none';
		  iniciobtn.classList.add('selecionado');
		  }
		  const nomeusuario = document.querySelector('.nomeusuario');
		  const janelacriarconta = document.getElementById('janelacriarconta');
		  nomeusuario.onclick = function() {
		  janelacriarconta.style.display = 'block';
		  }
		  const criarcontabtn = document.querySelector('.criarcontabtn');
		  const inputnomedousuario = document.querySelector('.inputnomedousuario');
		  criarcontabtn.addEventListener('click', () => {
			  const nome = inputnomedousuario.value.trim();
			  nomeusuario.textContent = nome;
			  if (nome === "") {
				  alert('Digite um nome');
				  return;
			  }
			  localStorage.setItem("nomeUsuario", nome);
			  inputnomedousuario.value = "";
			  janelacriarconta.style.display = 'none';
		  })
		  window.onload = function() {
			  const nomesalvo = localStorage.getItem("nomeUsuario");
			  const nomedacomunidadesalvo = localStorage.getItem("comunidade");
			  if (nomesalvo) {
				  nomeusuario.textContent = nomesalvo;
			  }
			  if (nomedacomunidadesalvo) {
				  nomedacomunidade.textContent = nomedacomunidadesalvo;
			  }
		  }
		  const fecharjanelacriarconta = document.querySelector('.fecharjanelacriarconta');
		  fecharjanelacriarconta.onclick = function() {
			  janelacriarconta.style.display = 'none';
		  }
	  </script>
  </body>
</html>
